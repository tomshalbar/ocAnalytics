services:
  - type: web
    name: open-court-analytics-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements-model.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    autoDeployTrigger: "off"
    envVars:
      # Keep large-model downloads/inference off this free API instance.
      - key: FORECAST_ENABLED
        value: "false"
      # After uploading snapshots, set FORECAST_ENABLED=true in Render.
      # database mode never loads the local inference model on this instance.
      - key: FORECAST_BACKEND
        value: "database"
      - key: PYTHON_VERSION
        value: 3.13.9
      - key: DATABASE_URL
        sync: false
      - key: RAW_DATA_TIMEZONE
        sync: false
      - key: SOURCE_DATA_TIMEZONE
        sync: false
