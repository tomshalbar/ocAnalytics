services:
  - type: web
    name: open-court-analytics-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    autoDeployTrigger: "off"
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.9
      - key: DATABASE_URL
        sync: false
      - key: RAW_DATA_TIMEZONE
        sync: false
      - key: SOURCE_DATA_TIMEZONE
        sync: false
