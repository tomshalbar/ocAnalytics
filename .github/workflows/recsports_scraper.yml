name: RecSports Scraper

on:
  schedule:
    - cron: "*/10 5-23 * * *"
      timezone: "America/New_York"

  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests pandas "psycopg[binary]" python-dotenv

      - name: Create data directory
        run: mkdir -p modeling/data

      - name: Run RecSports scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python modeling/src/scrapers/rec_sport_scraper.py
